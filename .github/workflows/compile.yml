name: Compile AHK to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile AHK Script
        uses: tamo/action-Ahk2Exe@v1
        with:
          in: Rabaty.ahk
          out: Rabaty.exe

      - name: Upload compiled EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabaty-EXE
          path: Rabaty.exe
