name: Compile AHK to EXE and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pobieramy z GitHub Releases (autohotkey.com blokuje runnery przez Cloudflare)
      - name: Download AutoHotkey v1 (with Ahk2Exe compiler)
        shell: pwsh
        run: |
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip"
          Invoke-WebRequest -Uri $url -OutFile "ahk.zip"
          Expand-Archive -Path "ahk.zip" -DestinationPath "$env:RUNNER_TEMP\ahk" -Force
          Get-ChildItem "$env:RUNNER_TEMP\ahk\Compiler" | Format-Table Name, Length

      - name: Syntax check and tests
        shell: pwsh
        run: |
          $ahk = "$env:RUNNER_TEMP\ahk\AutoHotkeyU32.exe"

          # 1) Sprawdzenie skladni calego programu (bez uruchamiania)
          $p = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut /iLib `"$env:RUNNER_TEMP\lib.ahk`" `"$PWD\Rabaty.ahk`"" `
                 -Wait -PassThru -NoNewWindow -RedirectStandardError "$env:RUNNER_TEMP\syntax.txt"
          Get-Content "$env:RUNNER_TEMP\syntax.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Blad skladni w Rabaty.ahk (kod $($p.ExitCode))" }
          Write-Host "Skladnia OK"

          # 2) Testy logiki i wpisywania klawiszy
          $t = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut `"$PWD\tests\test_rabaty.ahk`"" -PassThru -NoNewWindow
          if (-not $t.WaitForExit(300000)) { $t.Kill(); throw "Testy przekroczyly czas" }
          Get-Content "tests\wynik.txt" -ErrorAction SilentlyContinue
          if ($t.ExitCode -ne 0) { throw "Testy nie przeszly (kod $($t.ExitCode))" }

      - name: Compile AHK Script to EXE
        shell: pwsh
        run: |
          $ahk2exe = "$env:RUNNER_TEMP\ahk\Compiler\Ahk2Exe.exe"
          $bin     = "$env:RUNNER_TEMP\ahk\Compiler\Unicode 32-bit.bin"
          $in      = Join-Path $PWD "Rabaty.ahk"
          $out     = Join-Path $PWD "Rabaty.exe"
          if (Test-Path $out) { Remove-Item $out -Force }

          # Ahk2Exe to aplikacja GUI - trzeba czekac na jej zakonczenie
          $p = Start-Process -FilePath $ahk2exe `
                 -ArgumentList "/in `"$in`" /out `"$out`" /bin `"$bin`" /silent verbose" `
                 -Wait -PassThru -NoNewWindow
          Write-Host "Ahk2Exe exit code: $($p.ExitCode)"

          if (-not (Test-Path $out)) { throw "Kompilacja nie powiodla sie - brak Rabaty.exe" }
          Write-Host "Rabaty.exe OK, rozmiar: $((Get-Item $out).Length) bajtow"

      - name: Upload compiled EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabaty-EXE
          path: Rabaty.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Rabaty Bot (build ${{ github.run_number }})"
          files: Rabaty.exe
          make_latest: true
