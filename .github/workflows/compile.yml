name: Compile AHK to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AutoHotkey Portable & Compiler
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip" -OutFile "ahk.zip"
          Expand-Archive -Path "ahk.zip" -DestinationPath "$env:RUNNER_TEMP\ahk" -Force
          Write-Host "AutoHotkey downloaded successfully."

      - name: Compile AHK Script to EXE
        shell: powershell
        run: |
          $ahk2exe = "$env:RUNNER_TEMP\ahk\Compiler\Ahk2Exe.exe"
          $bin = "$env:RUNNER_TEMP\ahk\Compiler\Unicode 32-bit.bin"
          & $ahk2exe /in "Rabaty.ahk" /out "Rabaty.exe" /bin $bin
          if ($LASTEXITCODE -ne 0) {
              throw "Ahk2Exe exited with code $LASTEXITCODE."
          }

          $maxWaitSeconds = 15
          $elapsed = 0
          while (-not (Test-Path "Rabaty.exe") -and $elapsed -lt $maxWaitSeconds) {
              Start-Sleep -Seconds 1
              $elapsed++
          }

          if (-not (Test-Path "Rabaty.exe")) {
              throw "Compilation failed: Rabaty.exe was not created within $maxWaitSeconds seconds."
          }

          Write-Host "Rabaty.exe compiled successfully!"

      - name: Upload compiled EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabaty-EXE
          path: Rabaty.exe
