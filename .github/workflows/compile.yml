name: Compile AHK to EXE and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AutoHotkey Portable & Compiler
        shell: powershell
        run: |
          $zip = "$env:RUNNER_TEMP\AutoHotkey_1.1.37.02.zip"
          $destination = "$env:RUNNER_TEMP\ahk"
          $downloadUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $destination -Force

          $ahk2exe = Join-Path $destination "Compiler\Ahk2Exe.exe"
          $bin = Join-Path $destination "Compiler\Unicode 32-bit.bin"

          if (-not (Test-Path $ahk2exe)) {
              throw "Ahk2Exe.exe was not found after extracting AutoHotkey."
          }

          if (-not (Test-Path $bin)) {
              throw "Unicode 32-bit.bin was not found after extracting AutoHotkey."
          }

          Write-Host "AutoHotkey compiler downloaded successfully."

      - name: Validate input script exists
        shell: powershell
        run: |
          if (-not (Test-Path "Rabaty.ahk")) {
              throw "Source file Rabaty.ahk was not found."
          }

          if ((Get-Item "Rabaty.ahk").Length -eq 0) {
              throw "Source file Rabaty.ahk is empty."
          }

      - name: Compile AHK Script to EXE
        shell: powershell
        run: |
          $ahk2exe = "$env:RUNNER_TEMP\ahk\Compiler\Ahk2Exe.exe"
          $bin = "$env:RUNNER_TEMP\ahk\Compiler\Unicode 32-bit.bin"

          if (Test-Path "Rabaty.exe") {
              Remove-Item "Rabaty.exe" -Force
          }

          & $ahk2exe /in "Rabaty.ahk" /out "Rabaty.exe" /bin $bin

          if ($LASTEXITCODE -ne 0) {
              throw "Ahk2Exe failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path "Rabaty.exe")) {
              throw "Compilation failed: Rabaty.exe was not created."
          }

          Write-Host "Rabaty.exe compiled successfully! Size: $((Get-Item Rabaty.exe).Length) bytes"

      - name: Set release metadata
        id: release_meta
        shell: powershell
        run: |
          $tag = "v1.0-build-${{ github.run_number }}"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag_name=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_name=Rabaty Bot $tag"

      - name: Upload compiled EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabaty-EXE
          path: Rabaty.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: Rabaty.exe
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
