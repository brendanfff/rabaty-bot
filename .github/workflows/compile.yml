name: Compile AHK to EXE and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AutoHotkey Portable & Compiler
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/1.1/AutoHotkey_1.1.37.02.zip" -OutFile "ahk.zip"
          Expand-Archive -Path "ahk.zip" -DestinationPath "$env:RUNNER_TEMP\ahk" -Force
          Write-Host "AutoHotkey downloaded successfully."

      - name: Compile AHK Script to EXE
        shell: powershell
        run: |
          $ahk2exe = "$env:RUNNER_TEMP\ahk\Compiler\Ahk2Exe.exe"
          $bin = "$env:RUNNER_TEMP\ahk\Compiler\Unicode 32-bit.bin"
          & $ahk2exe /in "Rabaty.ahk" /out "Rabaty.exe" /bin $bin
          if (Test-Path "Rabaty.exe") {
              Write-Host "Rabaty.exe compiled successfully! Size: $((Get-Item Rabaty.exe).Length) bytes"
          } else {
              throw "Compilation failed!"
          }

      - name: Upload compiled EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rabaty-EXE
          path: Rabaty.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "Rabaty Bot v1.0"
          files: Rabaty.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
